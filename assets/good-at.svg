ext><text x="78" y="140" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#594F54">docs, test things out, and figure it out on the fly.</text><use href="#st" transform="translate(58 174) scale(.75)" fill="#FACDE5" stroke="#594F54" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="78" y="180" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#594F54">Coming up with practical ideas that solve specific, real-world bottlenecks instead of</text><text x="78" y="206" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#594F54">overcomplicating things.</text><use href="#st" transform="translate(58 240) scale(.75)" fill="#FACDE5" stroke="#594F54" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="78" y="246" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#594F54">Moving fast and executing — taking a rough concept and getting a working solution up and</text><text x="78" y="272" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#594F54">running quickly.</text><g transform="translate(818 59)"><g><use href="#st" fill="#FACDE5" stroke="#594F54" stroke-opacity=".6" stroke-width="1.1" vector-effect="non-scaling-stroke" transform="scale(1.50)"><animateTransform attributeName="transform" type="scale" values="0.38;1.50;0.38" dur="2.8s" begin="0.3s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></use></g></g><g transform="translate(778 48)"><g><use href="#st" fill="#594F54" transform="scale(0.80)"><animateTransform attributeName="transform" type="scale" values="0.20;0.80;0.20" dur="2.2s" begin="1.1s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>