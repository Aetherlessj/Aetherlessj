<svg xmlns="http://www.w3.org/2000/svg" width="888" height="330" viewBox="0 0 888 330" role="img" aria-label="What&#x27;s interesting about me?: Whenever I&#x27;m bored, I like to kill time building fun little games for the Linux terminal in Rust — nothing crazy complex yet, just simple side projects for the fun of it. I daily-drive Linux and genuinely enjoy tinkering with my system, automating workflows, and understanding how things work under the hood. My cat usually hangs out right behind me while I&#x27;m locked in coding (basically my unofficial pair programmer)."><title>What&#x27;s interesting about me?: Whenever I&#x27;m bored, I like to kill time building fun little games for the Linux terminal in Rust — nothing crazy complex yet, just simple side projects for the fun of it. I daily-drive Linux and genuinely enjoy tinkering with my system, automating workflows, and understanding how things work under the hood. My cat usually hangs out right behind me while I&#x27;m locked in coding (basically my unofficial pair programmer).</title><defs><path id="st" d="M0,-10 C1.4,-3.2 3.2,-1.4 10,0 C3.2,1.4 1.4,3.2 0,10 C-1.4,3.2 -3.2,1.4 -10,0 C-3.2,-1.4 -1.4,-3.2 0,-10Z"/></defs><rect width="888" height="330" fill="#FFB5D7"/><rect x="24" y="18" width="840" height="298" rx="22" fill="#FFB5D7" stroke="#FACDE5" stroke-width="5"/><rect x="34" y="28" width="820" height="278" rx="15" fill="none" stroke="#FACDE5" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="52" y="40" width="337" height="38" rx="19" fill="#FACDE5" stroke="#594F54" stroke-opacity=".0"/><text x="74" y="66" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#594F54">What&#x27;s interesting about me?</text><use href="#st" transform="translate(58 108) scale(.75)" fill="#FACDE5" stroke="#594F54" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="78" y="114" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#594F54">Whenever I&#x27;m bored, I like to kill time building fun little games for the Linux terminal in Rust —</text><text x="78" y="140" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#594F54">nothing crazy complex yet, just simple side projects for the fun of it.</text><use href="#st" transform="translate(58 174) scale(.75)" fill="#FACDE5" stroke="#594F54" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="78" y="180" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#594F54">I daily-drive Linux and genuinely enjoy tinkering with my system, automating workflows, and</text><text x="78" y="206" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#594F54">understanding how things work under the hood.</text><use href="#st" transform="translate(58 240) scale(.75)" fill="#FACDE5" stroke="#594F54" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="78" y="246" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#594F54">My cat usually hangs out right behind me while I&#x27;m locked in coding (basically my unofficial pair</text><text x="78" y="272" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#594F54">programmer).</text><g transform="translate(818 59)"><g><use href="#st" fill="#FACDE5" stroke="#594F54" stroke-opacity=".6" stroke-width="1.1" vector-effect="non-scaling-stroke" transform="scale(1.50)"><animateTransform attributeName="transform" type="scale" values="0.38;1.50;0.38" dur="2.8s" begin="0.3s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></use></g></g><g transform="translate(778 48)"><g><use href="#st" fill="#594F54" transform="scale(0.80)"><animateTransform attributeName="transform" type="scale" values="0.20;0.80;0.20" dur="2.2s" begin="1.1s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/><animate attributeName="opacity" values=".35;1;.35" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></use></g></g><g transform="translate(844 88)"><g><use href="#st" fill="#FACDE5" stroke="#594F54" stroke-opacity=".6" stroke-width="1.1" vector-effect="non-scaling-stroke" transform="scale(0.90)"><animateTransform attributeName="transform" type="scale" values="0.23;0.90;0.23" dur="3.2s" begin="0.8s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/><animate attributeName="opacity" values=".35;1;.35" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></use></g></g></svg>